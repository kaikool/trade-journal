<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08080a" />
    <title>Offline · Trade Journal</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #08080a;
        color: #f4f4f4;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      p {
        color: #9c9ca6;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Reconnect to the internet to open your journal. Private journal data is not stored on this
        device for offline use.
      </p>
    </main>
  </body>
</html>
