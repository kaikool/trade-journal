name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'packages/*/src/**', 'apps/web/next.config.*', 'apps/web/postcss.config.*', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-node22-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-licenses.mjs
      - run: pnpm -r --filter "./packages/*" build
      - name: Build without production database credentials
        run: pnpm build
        env:
          # Next imports API modules while collecting routes. This URL is only
          # for compilation; any accidental database query must fail in CI.
          DATABASE_URL: postgres://build:build@127.0.0.1:9/journal
          NEXT_TELEMETRY_DISABLED: "1"
